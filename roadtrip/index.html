<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road trip</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="goals.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Roboto', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            touch-action: none;
        }

        canvas {
            display: block;
        }

        .credit-link-container {
            position: absolute;
            bottom: 15px;
            left: 15px;
            color: #a59b62;
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            font-weight: 700;
            z-index: 100;
            /* Pill Styling */
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 6px;
            /* Interaction */
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            pointer-events: auto;
            touch-action: auto;
        }

        .credit-link-container a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .credit-link-container a:hover {
            color: #ffffff;
        }

        .credit-link-container .separator {
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div class="mute-pill">
        <button id="mute-toggle" class="mute-toggle" type="button" aria-label="Toggle sound" aria-pressed="false" title="Toggle sound">
            <svg class="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            <svg class="icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>
        </button>
    </div>
    <script src="vendor/pixi.min.js"></script>
    <script src="vendor/pixi-sound.js"></script>
    <script src="vendor/lil-gui.js"></script>
    <script src="app.js"></script>
    <script src="goals.js"></script>
</body>

</html>
