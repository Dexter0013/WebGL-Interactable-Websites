<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess 2</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="goals.css">
    <script src="vendor/pixi.min.js"></script>

</head>

<body>
<div id="stats-container" class="pill-container top-left hidden">

    <div id="white-stats" class="stats-row"></div>
    <div id="black-stats" class="stats-row"></div>
</div>
<div id="app-container"></div>
<div class="mute-pill pill-container">

        <svg class="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>

    </button>
</div>
<script type="module" src="main.js"></script>
<script src="goals.js"></script>

</html>
